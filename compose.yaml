services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maxup
      POSTGRES_USER: maxup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxup_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - maxup-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxup -d maxup"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: maxup
      PGUSER: maxup
      PGPASSWORD: ${POSTGRES_PASSWORD:-maxup_local_dev}
      FRONTEND_ORIGIN: http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy

volumes:
  maxup-data:
